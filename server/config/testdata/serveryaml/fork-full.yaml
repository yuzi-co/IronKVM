proto: https
host: 10.0.30.222
port:
    http: 8080
    https: 8443
cert:
    crt: /etc/kvm/server.crt
    key: /etc/kvm/server.key
logger:
    level: debug
    file: /tmp/server.log
authentication: enable
jwt:
    secretKey: 0123456789abcdef
    refreshTokenDuration: 86400
    revokeTokensOnLogout: false
stun: disable
turn:
    turnAddr: turn.example.com:3478
    turnUser: user
    turnCred: cred
security:
    loginLockoutDuration: 300
    loginMaxFailures: 3
    allowedNetworks:
        - 10.0.0.0/8
        - 192.168.1.5
ion:
    reserveFloor: 25165824
proxy: http://proxy.lan:3128
http2: true
hardware:
    powerLed: true
redfish:
    enabled: false
watchdog:
    enabled: true
    timeoutMinutes: 7
    action: power
    cooldownMinutes: 20
    maxPerHour: 2
    pingHost: 10.0.30.1
nut:
    enabled: true
    host: nut.lan
    port: 3494
    ups: ups1
    username: monuser
    onBatteryMinutes: 4
    forceOffMinutes: 6
    powerOnRestore: true
    powerOnMinCharge: 40
    powerOnDelaySeconds: 90
ipmi:
    enabled: true
netboot:
    usb: true
    lan: true
vnc:
    enabled: true
    port: 5901
    maxFps: 10
    vncAuth: true
webrtc:
    udpPort: 50000
    publicAddress: kvm.example.com
whep:
    enabled: true
rtsp:
    enabled: true
    port: 8555
    udp: true
    udpPort: 8002
    tls: true
    tlsPort: 8323
srt:
    enabled: true
    port: 8891
    latencyMs: 200
picoclaw:
    screenshotWidth: 1280
    screenshotQuality: 70
hostlog:
    syslog:
        enabled: true
        port: 5514
    netconsole:
        enabled: true
        port: 6667
    bind: usb
    sources:
        - 10.0.30.0/24
    memoryKb: 512
    disk: true
    diskKb: 2048
    patterns:
        - panic
        - '\bBUG\b'
