allowBuilds:
  bufferutil: true
  es5-ext: true
  esbuild: true
  msw: true
  utf-8-validate: true

# pnpm 11 reads its settings from this file rather than from package.json.
#
# Two packages are held above what their parents ask for, because the parent
# resolves a version below the one that carries the fix:
#
#   esbuild      vite 8.2.0 resolves 0.27.7. GHSA-g7r4-m6w7-qqqr, an esbuild
#                dev server that reads arbitrary files on Windows, is fixed in
#                0.28.1.
#   @babel/core  jotai resolves 7.29.0. GHSA-4x5r-pxfx-6jf8, an arbitrary file
#                read through a sourceMappingURL comment, is fixed in 7.29.6.
#
# Neither package is reachable from a built artefact, and with the floor raised
# neither resolves at all: vite 8 builds with rolldown and nothing here uses
# jotai's babel plugin. Both are kept so that a future parent cannot quietly
# pull the vulnerable version back in.
overrides:
  esbuild: ^0.28.1
  '@babel/core': ^7.29.6
